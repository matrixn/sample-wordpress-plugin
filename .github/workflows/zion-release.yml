name: Build My New Plugin Demo

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader
      - name: Build ZIP
        run: zip -r "my-new-plugin-demo.zip" . -x '.git/*' '.github/*' 'tests/*'
      - name: Upload ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "my-new-plugin-demo.zip" --clobber